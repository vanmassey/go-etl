name: Go Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Go environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Verify code formatting
      run: go fmt ./...

    - name: Compile data engine binary
      run: go build -v -o go-etl .

    - name: Run automated unit tests
      run: go test -v ./...
